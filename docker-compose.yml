services:
  app:
    build: .
    image: api-client:latest
    ports: ["${PORT:-3000}:3000"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      # Cookies are Secure in production. Keep "false" only for plain-http local use; set to "true" behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # SSRF protection blocks private/loopback targets. Enable ONLY to call internal/dev APIs from this server.
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
    volumes: ["apiclient-data:/data"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
volumes:
  apiclient-data:
